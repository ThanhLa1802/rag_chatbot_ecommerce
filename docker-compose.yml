version: '3.8'

services:
  rag_api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: rag_api_service
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=${DATABASE_URL} 
      - QDRANT_URL=http://qdrant_db:6333
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      - qdrant_db
      - redis
      - mysql_db
    restart: unless-stopped
    networks:
      - backend

  qdrant_db:
    image: qdrant/qdrant:latest
    container_name: qdrant_vector_db
    ports:
      - "6333:6333" # Port REST API
      - "6334:6334" # Port gRPC (nếu dùng)
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - backend

  
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - backend

  mysql_db:
    image: mysql:8.0
    container_name: ecommerce_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ecommerce_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Tự động chạy file init.sql khi container khởi tạo lần đầu
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql 
    restart: unless-stopped
    networks:
      - backend

  celery_worker:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker_service
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=http://qdrant_db:6333
    volumes:
      - ./app:/app/app
    depends_on:
      - redis
      - mysql_db
      - qdrant_db
    restart: unless-stopped
    networks:
      - backend


volumes:
  qdrant_storage:
  mysql_data:
  redis_data:

networks:
  backend: